# Detection Name
Successful SSH Login After Failed Authentication

# Purpose
Detect a successful SSH authentication from an IP that previously
generated failed SSH authentication attempts.

# SPL
index=resilient_linux_auth host=kali
("Failed password" OR "Accepted password")
| rex "from (?<src_ip>\d+\.\d+\.\d+\.\d+)"
| rex "for (?<user>\S+)"
| eval auth_result=if(match(_raw,"Failed password"),"FAILED","SUCCESS")
| sort 0 src_ip _time
| streamstats window=5 values(auth_result) as recent_auth by src_ip
| where auth_result="SUCCESS" AND mvfind(recent_auth,"FAILED")>=0
| table _time src_ip user auth_result recent_auth _raw

# Severity
High

# Data Source
resilient_linux_auth / auth.log

# Trigger Logic
Generate an alert when a successful SSH authentication is observed
from a source IP that had a failed authentication shortly before it.

# False Positives
- User entered an incorrect password before successfully authenticating.
- Administrator troubleshooting.
- Legitimate scripted authentication retries.

# Investigation
1. Identify source IP and account.
2. Review failed authentication attempts immediately before success.
3. Check whether the source IP is expected.
4. Review the user's activity after login.
5. Correlate with process execution and persistence changes.

# MITRE ATT&CK
T1078 - Valid Accounts
