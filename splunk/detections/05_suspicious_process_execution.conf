# Detection Name
Suspicious Process Execution After SSH

# Purpose
Identify potentially suspicious process execution on Linux following
a remote SSH session.

# SPL
index=resilient_linux_auditd host=kali key=process_exec
| table _time auid uid comm exe tty ses _raw
| sort 0 _time

# Severity
Medium

# Data Source
resilient_linux_auditd / audit.log

# Trigger Logic
Investigate process execution occurring in or immediately after a
new SSH session, especially administrative utilities, scripting
interpreters, or persistence-related commands.

# False Positives
- Normal user commands.
- Administrative maintenance.
- Analyst/lab activity.

# Investigation
1. Identify the process and executable.
2. Determine the associated user/session.
3. Correlate the process with SSH authentication time.
4. Check for persistence or configuration changes.
5. Determine whether the process is expected.

# MITRE ATT&CK
T1059 - Command and Scripting Interpreter
Confidence: Requires validation based on the observed executable/command.
