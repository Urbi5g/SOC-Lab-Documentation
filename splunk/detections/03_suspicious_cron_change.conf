# Detection Name
Suspicious Cron Modification

# Purpose
Detect modification of user cron jobs.

# SPL
index=resilient_linux_auditd host=kali key=cron_changes
| search comm="crontab" OR exe="/usr/bin/crontab"
| rex "auid=(?<auid>\d+)"
| table _time auid comm exe tty ses _raw

# Severity
High

# Data Source
resilient_linux_auditd / audit.log

# Trigger Logic
Any cron modification performed by a user should be investigated,
especially when it follows remote authentication.

# False Positives
- Legitimate administrator scheduling.
- User-managed cron jobs.
- Maintenance scripts.

# Investigation
1. Identify the user.
2. Identify the parent session.
3. Review the resulting crontab.
4. Review the scheduled command or script path.
5. Correlate with preceding SSH authentication.

# MITRE ATT&CK
T1053.003 - Scheduled Task/Job: Cron
