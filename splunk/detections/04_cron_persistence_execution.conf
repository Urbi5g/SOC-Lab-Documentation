# Detection Name
Cron-Scheduled Script Execution

# Purpose
Detect execution of scripts that are referenced by user cron jobs.

# SPL
index=resilient_linux_auditd host=kali key=process_exec
| rex "exe=\"(?<exe_path>[^\"]+)\""
| rex "a0=\"(?<command0>[^\"]+)\""
| search exe_path="/home/kali/dummy_check.sh"
    OR _raw="/home/kali/dummy_check.sh"
| table _time auid uid exe_path command0 tty ses _raw

# Severity
High

# Data Source
resilient_linux_auditd / audit.log

# Trigger Logic
Alert when the cron target or suspicious scheduled script is observed
in process execution telemetry.

# False Positives
- Authorized scheduled scripts.
- System maintenance tasks.
- Lab automation.

# Investigation
1. Verify the script path.
2. Review file ownership and permissions.
3. Review script contents.
4. Determine who configured the cron job.
5. Correlate execution time with the cron schedule.

# MITRE ATT&CK
T1053.003 - Scheduled Task/Job: Cron
