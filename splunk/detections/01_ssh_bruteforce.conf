# Detection Name
SSH Brute Force / Repeated Failed Authentication

# Purpose
Detect repeated failed SSH authentication attempts from the same
source IP against the Kali host.

# SPL
index=resilient_linux_auth host=kali "Failed password"
| rex "Failed password for (?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+)"
| where src_ip!="192.168.127.128"
| stats count min(_time) as first_seen max(_time) as last_seen values(user) as users by src_ip
| where count >= 5

# Severity
Medium

# Data Source
resilient_linux_auth / auth.log

# Trigger Logic
Five or more failed SSH authentication attempts from the same source IP.

# False Positives
- User entering the wrong password repeatedly.
- Administrative automation using incorrect credentials.
- Lab/test activity.

# Investigation
1. Identify the source IP.
2. Check whether authentication later succeeded.
3. Review the target username.
4. Correlate with process execution and network activity.
5. Determine whether the source is an expected administrative host.

# MITRE ATT&CK
T1110 - Brute Force
